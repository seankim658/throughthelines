[project]
name = "pipeline"
version = "0.7.0"
description = "Build pipeline for Through the Lines: address-keyed congressional district history."
readme = "README.md"
authors = [
    { name = "Sean Kim", email = "33474168+seankim658@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.43.34",
    "geopandas>=1.1.3",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.2",
    "pyogrio>=0.12.1",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
]

[project.scripts]
pipeline = "pipeline:main"

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.0",
    "ruff>=0.17.0",
    "types-boto3[s3]>=1.43.34",
    "types-geopandas>=1.1.3.20260408",
    "types-pyyaml>=6.0.12.20260408",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "S",
    "SIM", "PT", "PTH", "T20", "ERA", "RUF",
]

[tool.ruff.lint.per-file-ignores]
# The CLI reports to the terminal with print.
"src/pipeline/cli/**" = ["T201"]
# pytest reports through assert.
"tests/**" = ["S101"]

[tool.pytest]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
filterwarnings = ["error"]
