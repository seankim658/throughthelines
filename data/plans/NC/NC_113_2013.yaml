# Racial-gerrymander history of this plan is kept distinct from the successor's partisan case.
notes: >-
  The racial-gerrymander invalidation of this plan is separate from the partisan-gerrymander
  litigation over its successor, the 2016 remedial plan (Senate Bill 2, Session Law 2016-1),
  which the U.S. Supreme Court addressed in Rucho v. Common Cause, 588 U.S. 684 (2019). The
  case caption changed from Harris v. McCrory at the district court to Cooper v. Harris at the
  Supreme Court after Roy Cooper succeeded Pat McCrory as Governor [COOPER]. A parallel
  state-court challenge, Dickson v. Rucho, upheld the 2011 districts before that judgment was
  vacated and mooted following Cooper v. Harris [DICKSON]. A technical curative act (Senate
  Bill 689, Session Law 2011-414) corrected a software coding error in the plan's textual block
  assignments in November 2011 but did not alter the map [NCGA-689]. Under the plan, North
  Carolina's U.S. House delegation went from a 7-6 Democratic majority under the predecessor
  map (2010) to a 9-4 Republican majority in 2012 and a 10-3 Republican majority in 2014
  [SABATO].

