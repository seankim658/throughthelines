effective_date: 2011-11-01

# [NCGA-453, AAR]
origin: legislature
origin_details: >-
  Enacted by the North Carolina General Assembly as Senate Bill 453, which became Session
  Law 2011-403 and is named "Rucho-Lewis Congress 3"; it was sponsored by Senators Rucho,
  Brock, and Brown, passed on July 27, 2011, and ratified on July 28, 2011 [NCGA-453]. It
  was precleared by the U.S. Department of Justice under Section 5 of the Voting Rights Act
  on November 1, 2011, and was used for the 2012 and 2014 U.S. House elections [AAR]. North
  Carolina's congressional plans are drawn by the legislature and are not subject to
  gubernatorial veto [NC-CONST].

# Partial strikedown: Districts 1 & 12 as racial gerrymanders (Harris/Cooper). District
# numbers and the 14th-Amendment Equal Protection basis come from those opinions.
struck_down: true
struck_down_details: >-
  Partial, not plan-wide. On February 5, 2016, a three-judge panel of the U.S. District
  Court for the Middle District of North Carolina held that two of the state's congressional
  districts, District 1 and District 12, were unconstitutional racial gerrymanders under the
  Equal Protection Clause of the Fourteenth Amendment [HARRIS]. The court found that race
  predominated over traditional districting criteria: District 1 was drawn to a black
  voting-age population above 50 percent (rising from 48.6 to 52.7 percent) and District 12's
  black voting-age population was raised from 43.8 to 50.7 percent, without a strong basis in
  evidence that the Voting Rights Act required either change [COOPER]. The U.S. Supreme Court
  affirmed on May 22, 2017, upholding the District 1 ruling by an 8-0 vote (Justice Gorsuch
  took no part) and the District 12 ruling by a 5-3 vote [COOPER]. The remaining districts
  were not invalidated.
struck_down_districts: [1, 12]

