# [NCGA-S2]
# SB 2 (2016 First Extra Session): Senate 2nd + 3rd readings 2016-02-18 (32-15);
# House 2016-02-19 (65-43); ratified and chaptered as SL 2016-1 on 2016-02-19.
enacted_date: 2016-02-19
# [NCGA-S2, SHELBY]
# No Section 5 preclearance required (Shelby County v. Holder, 2013, ended coverage);
# Section 2 made the plan effective on enactment for the 2016–2020 elections.
effective_date: 2016-02-19

# [NCGA-S2, AAR]
origin: legislature
# [NCGA-S2]   SB 2 -> SL 2016-1; 2016 First Extra Session; primary sponsor Rucho.
# [NCGA-PROC] enacted map designated "2016 Contingent Congressional Plan - Corrected".
# [HARRIS]    remedial trigger: 2011 Districts 1 & 12 struck 2016-02-05; new map ordered within two weeks.
# [SHELBY]    no preclearance (post-Shelby County).
# [NC-CONST]  no gubernatorial veto for congressional plans (art. II, § 22(5)).
origin_details: >-
  Drawn and enacted by the North Carolina General Assembly as Senate Bill 2, which became
  Session Law 2016-1 in the 2016 First Extra Session [NCGA-S2]; the enacted map is designated
  the "2016 Contingent Congressional Plan – Corrected" [NCGA-PROC]. It was a court-ordered
  remedy: on February 5, 2016 a three-judge panel of the U.S. District Court for the Middle
  District of North Carolina struck two districts of the 2011 plan as unconstitutional racial
  gerrymanders in Harris v. McCrory and ordered the General Assembly to enact a new plan within
  two weeks [HARRIS]. Because Shelby County v. Holder had ended the practical operation of Voting
  Rights Act Section 5 preclearance in 2013, the plan was not precleared and took effect on
  enactment [SHELBY]. North Carolina's congressional plans are drawn by the legislature and are
  not subject to gubernatorial veto [NC-CONST]. It was used for the 2016 and 2018 U.S. House
  elections [AAR].

# Two partisan-gerrymander challenges; neither targeted specific districts -> struck_down_districts: [].
# [HARPER] state preliminary injunction (2019-10-28) that STOOD and stopped the plan -> struck_down: true.
struck_down: true
# [RUCHO]  federal: M.D.N.C. panel held it a partisan gerrymander (Common Cause v. Rucho,
#          318 F. Supp. 3d 777, 2018); SCOTUS VACATED 2019-06-27 (5-4) as nonjusticiable -> did not stand.
# [HARPER] state: Wake Cty. three-judge panel preliminarily enjoined the plan 2019-10-28 under the
#          NC Constitution; never reversed; overtaken when the GA enacted SL 2019-249 (Nov 2019).
struck_down_details: >-
  The plan was challenged as a partisan gerrymander on two tracks [AAR-CCR]. In federal court, a
  three-judge panel held it an unconstitutional partisan gerrymander in Common Cause v. Rucho, but
  the U.S. Supreme Court vacated that judgment in Rucho v. Common Cause on June 27, 2019, holding
  by a 5-4 vote that partisan-gerrymandering claims are nonjusticiable in federal court, so the
  federal courts did not invalidate the plan [RUCHO]. In state court, a three-judge panel of the
  Wake County Superior Court preliminarily enjoined the plan on October 28, 2019 in Harper v.
  Lewis, finding it a likely partisan gerrymander under the Free Elections, Equal Protection, and
  Free Speech and Assembly clauses of the North Carolina Constitution [HARPER]. That injunction was
  never reversed; the General Assembly enacted a replacement plan the following month, and the
  state challenge was not carried to a final judgment [AAR-HVL]. The challenge was to the plan
  statewide rather than to specific districts.
struck_down_districts: []

# predecessor NC_113_2013 = 2011 "Rucho-Lewis Congress 3" (SB 453 / SL 2011-403); its Districts 1 & 12
#   were struck in Harris v. McCrory, which compelled this remedial plan. [HARRIS]
# superseded_by NC_117_2021 = 2019 remedial plan (HB 1029 / SL 2019-249, 2019-11-15), used in 2020;
#   enacted after the Harper v. Lewis injunction. [AAR-HVL]
superseded_by: NC_117_2021
predecessor: NC_113_2013

# Roles are relative to THIS (2016) plan:
# [HARRIS] Harris v. McCrory -> enabling: the order that compelled this remedial plan.
# [RUCHO]  Rucho v. Common Cause (SCOTUS) -> context: vacated the M.D.N.C. partisan-gerrymander
#          ruling (Common Cause v. Rucho, 318 F. Supp. 3d 777) on nonjusticiability; did not
#          invalidate the plan. The SCOTUS opinion quotes the M.D.N.C. findings (incl. the Lewis
#          statement) at 807-809. (parallel: 139 S. Ct. 2484)
# [HARPER] Harper v. Lewis -> invalidating: state preliminary injunction (2019-10-28) that stopped
#          the plan; unpublished order. A 2019-11-20 order in the same case recites it
#          (https://s3.documentcloud.org/documents/6555665/191120-Order-19-CVS-012667.pdf).
# [SHELBY] Shelby County v. Holder (2013) -> context: ended the practical operation of VRA Section 5,
#          so this plan needed no preclearance.
# Not included: Common Cause v. Lewis (state legislative maps) and Cooper v. Harris (the 2011 plan's
#   racial-gerrymander appeal) -> other files.
