# [RUCHO] (quoting the M.D.N.C. record, 318 F. Supp. 3d 777, 808–809): Lewis's 10–3 statement.
# [CLERK-2016] 2016 result: 10 R – 3 D. [NCSBE] 2018 result + District 9 saga.
notes: >-
  The partisan intent was stated openly while the plan was drawn. The redistricting committee's
  co-chair, Representative David Lewis, proposed drawing a map to give "a partisan advantage to 10
  Republicans and 3 Democrats" because he did not believe a map with eleven Republicans and two
  Democrats could be drawn; the U.S. Supreme Court quoted that record in Rucho v. Common Cause
  [RUCHO]. Under the plan, Republicans won ten of the state's thirteen U.S. House seats in 2016
  [CLERK-2016]. The 2018 election initially produced the same ten-to-three split, but the District
  9 contest was not certified amid an absentee-ballot fraud investigation; the seat sat vacant at
  the start of the 116th Congress until a September 2019 special election, which a Republican won,
  restored the ten-to-three delegation [NCSBE]. The U.S. Supreme Court case most associated with
  this plan, Rucho v. Common Cause, concerned it but did not strike it down; the operative bar on
  the plan was the state court's preliminary injunction in Harper v. Lewis [HARPER].

