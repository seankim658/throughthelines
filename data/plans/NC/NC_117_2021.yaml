# [NCGA-H1029]
# HB 1029: House 2nd reading 2019-11-14 (55-46); Senate 2nd + 3rd readings 2019-11-15 (24-17);
# ratified and chaptered as SL 2019-249 on 2019-11-15.
enacted_date: 2019-11-15
# [NCGA-H1029, SHELBY]
# No Section 5 preclearance required (Shelby County v. Holder, 2013, ended coverage);
# effective when it became law (2019-11-15).
effective_date: 2019-11-15

# [NCGA-H1029, AAR]
origin: legislature
# [NCGA-H1029] HB 1029 -> SL 2019-249; primary sponsors Lewis, D. Hall; no gubernatorial veto.
# [HARPER-I]   remedial trigger: 2016 plan preliminarily enjoined 2019-10-28; GA redrew in response.
# [AAR]        drawn by the Joint Select Committee in open, livestreamed sessions; election/racial data barred.
# [SHELBY]     no preclearance (post-Shelby County). [NC-CONST] no veto (art. II, § 22(5)).
origin_details: >-
  Drawn and enacted by the North Carolina General Assembly as House Bill 1029, which became
  Session Law 2019-249 [NCGA-H1029]. It was a remedy: a state three-judge panel had
  preliminarily enjoined the prior 2016 plan in Harper v. Lewis on October 28, 2019 as a likely
  partisan gerrymander under the North Carolina Constitution, and the General Assembly redrew the
  map in response [HARPER-I]. The Joint Select Committee on Congressional Redistricting drew the
  plan in open, livestreamed committee sessions under criteria that barred the use of election and
  racial data [AAR]. Because Shelby County v. Holder had ended the practical operation of Voting
  Rights Act Section 5 preclearance in 2013, the plan was not precleared and took effect on
  enactment [SHELBY]. North Carolina's congressional plans are drawn by the legislature and are
  not subject to gubernatorial veto [NC-CONST]. It was used only for the 2020 U.S. House election
  and was then replaced through the ordinary redistricting cycle that followed the 2020 census
  [AAR].

# Never invalidated. The plan ended by ordinary decennial (2020 census) replacement, not by any
# court ruling -> struck_down: false; struck_down_districts: [].
# [HARPER-II] On 2019-12-02 the Harper v. Lewis panel lifted the candidate-filing stay and allowed
#             the 2020 elections to proceed under this plan, without ruling on its constitutionality.
struck_down: false
struck_down_details: >-
  This plan was not struck down. It was enacted as a remedy, used for the 2020 U.S. House
  election, and then replaced through the ordinary redistricting cycle that followed the 2020
  census [AAR]. In Harper v. Lewis, the state court that had enjoined the predecessor plan lifted
  its candidate-filing stay on December 2, 2019 and allowed the 2020 elections to proceed under
  this remedial plan, without ruling on its constitutionality [HARPER-II].
struck_down_districts: []

# predecessor NC_115_2017 = 2016 plan (SB 2 / SL 2016-1); preliminarily enjoined in Harper v. Lewis,
#   which compelled this remedial plan. [HARPER-I]
# superseded_by NC_118_2023 = the plan used for the 2022 election (118th Congress), reached through the
#   post-2020-census cycle. The 2021 enacted plan (SB 740 / SL 2021-174) was struck in Harper v. Hall
#   (868 S.E.2d 499, N.C. 2022) and the 2022 election ran on a court-drawn interim plan; that successor's
#   litigation belongs to its own file.
superseded_by: NC_118_2023
predecessor: NC_115_2017

# Roles are relative to THIS (2019) plan:
# [HARPER-I]  Harper v. Lewis, 2019-10-28 preliminary injunction against the 2016 plan -> enabling:
#             the strike of the predecessor that compelled this remedy. Unpublished order,
#             No. 19-CVS-012667 (N.C. Super. Ct., Wake Cnty.).
# [HARPER-II] Harper v. Lewis, 2019-12-02 order -> context: lifted the filing stay and allowed the
#             2020 elections under this plan; no merits ruling on this plan. Same case/court.
# [SHELBY]    Shelby County v. Holder (2013) -> context: ended the practical operation of VRA Section 5,
#             so this plan needed no preclearance.
# Not included: Harper v. Hall (868 S.E.2d 499, N.C. 2022) and Moore v. Harper (600 U.S. 1, 2023) concern
#   the LATER 2021 plan (SL 2021-174), not this plan; they belong in the successor's file.
