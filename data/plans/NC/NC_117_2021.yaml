# [NCGA-MAP] single-cycle interim map on 2010-census block geometry.
# [CLERK-2020] 2020 result: 8 R - 5 D; NC-2 (Ross) and NC-6 (Manning) flipped Democratic.
notes: >-
  This was North Carolina's only congressional map used for a single election in the 2010s,
  governing the 117th Congress alone, and it was drawn on 2010-census block geometry as an interim
  replacement [NCGA-MAP]. Under the plan, the November 2020 election produced an eight-to-five
  Republican-to-Democratic delegation, narrowing the prior ten-to-three Republican advantage:
  Districts 2 and 6, redrawn to lean Democratic around Raleigh and Greensboro, both flipped after
  their Republican incumbents declined to seek re-election in the redrawn seats [CLERK-2020].

