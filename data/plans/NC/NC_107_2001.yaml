    role: enabling
    url: https://supreme.justia.com/cases/federal/us/517/899/
    archived_url: https://web.archive.org/web/20260202194156/https://supreme.justia.com/cases/federal/us/517/899/
    source_code: SHAW
  - case: Hunt v. Cromartie
    citation: "526 U.S. 541 (1999)"
    role: context
    url: https://supreme.justia.com/cases/federal/us/526/541/
    archived_url: https://web.archive.org/web/20250907102145/https://supreme.justia.com/cases/federal/us/526/541/
    source_code: CROMARTIE-I
  - case: Cromartie v. Hunt
