# [NCGA-586, CROMARTIE-REMAND]
# HB 586 ratified as SL 1997-11 on 1997-03-31 ("97 House/Senate Plan A"); a remedial plan after
# Shaw v. Hunt struck the 1992 District 12. Cromartie v. Hunt recites enactment "on March 31, 1997."
enacted_date: 1997-03-31
# [AAR]
# NC was a partial Section 5 jurisdiction (40 of 100 counties); the 1997 plan was precleared in 1997
# (June per secondary records), but no primary source gives the exact DOJ preclearance date. DOJ
# publishes only objection letters, so the no-objection letter is not locatable without a FOIA, and
# no day-level date is available -> unknown.
effective_date: unknown

# [NCGA-586, AAR]
origin: legislature
# [NCGA-586] HB 586 -> SL 1997-11; "97 House/Senate Plan A"; legislature-drawn remedial map.
# [SHAW]     Shaw v. Hunt (1996) struck the 1992 District 12, prompting this remedial plan.
# [AAR]      retained a majority-Black District 1; precleared under Section 5 in 1997.
# [NCGA]     designated the plan used for the 2000 election.
# [NC-CONST] NC congressional plans not subject to gubernatorial veto (art. II, § 22(5)).
origin_details: >-
  Enacted by the North Carolina General Assembly as House Bill 586, which became Session Law
  1997-11 and is named "97 House/Senate Plan A" [NCGA-586]. It was a remedial congressional plan
  drawn after the U.S. Supreme Court held the 1992 plan's 12th District an unconstitutional racial
  gerrymander in Shaw v. Hunt in 1996; the 1997 plan reshaped the 12th District while retaining a
  majority-Black 1st District [SHAW]. Ratified on March 31, 1997 [NCGA-586] and precleared under
  Section 5 of the Voting Rights Act in 1997 [AAR], it was the plan in legal effect for the
  November 2000 U.S. House election that seated the 107th Congress [NCGA]. North Carolina's
  congressional plans are drawn by the legislature and are not subject to gubernatorial veto
  [NC-CONST].

# Used in the 2000 election and never struck by a ruling that stood; the District 12 invalidation
# was reversed twice.
struck_down: false
# [CROMARTIE-I]      1999-05-17: SCOTUS reversed the first (summary-judgment) invalidation of District 12.
# [CROMARTIE-REMAND] 2000-03-07: three-judge E.D.N.C. court (2-1) struck District 12 again after trial;
#                    District 1 upheld. Stayed by SCOTUS (529 U.S. 1014 (2000)) -> plan used in Nov 2000
#                    -> reversed by [CROMARTIE-II].
# [CROMARTIE-II]     2001-04-18 (5-4): District 12 upheld as predominantly political, not racial.
struck_down_details: >-
  This plan was not struck down. Its 12th District was challenged as a racial gerrymander
  throughout the late 1990s, and a three-judge federal court invalidated it twice. The first
  invalidation, on summary judgment, was reversed by the U.S. Supreme Court in Hunt v. Cromartie in
  1999 [CROMARTIE-I]. The court struck the district again after a trial on March 7, 2000
  [CROMARTIE-REMAND], but the Supreme Court stayed that order, allowing the plan to be used in the
  November 2000 election, and then reversed it in Easley v. Cromartie in 2001, holding that the 12th
  District was drawn predominantly on political rather than racial grounds [CROMARTIE-II]. The 1st
  District was challenged but upheld [CROMARTIE-REMAND]. No adverse ruling against the plan stood.
struck_down_districts: []

# superseded_by NC_108_2003 = 2001 plan "Congress ZeroDeviation" (HB 32 / SL 2001-479), which added
#   the 13th district and was first used in 2002. [NCGA]
# predecessor NC_106_1999 = 1998 plan (HB 1394 / SL 1998-2), used for the 1998 election. NOTE the
#   election-sequence quirk: the 1998 plan was enacted AFTER this 1997 plan but governed the EARLIER
#   (1998) election; this 1997 plan was restored by the 1998 plan's reversion proviso for 2000. The
#   chain is by election, not enactment date. [CROMARTIE-I]
superseded_by: NC_108_2003
predecessor: NC_106_1999

# Roles are relative to THIS (1997) plan:
# [SHAW]             Shaw v. Hunt (1996) -> enabling: struck the 1992 District 12, prompting this remedial plan.
# [CROMARTIE-I]      Hunt v. Cromartie (1999) -> context: reversed the first invalidation of this plan's
#                    District 12; also recites the 1998 plan's reversion proviso restoring this plan.
# [CROMARTIE-REMAND] Cromartie v. Hunt (E.D.N.C. 2000) -> context: struck District 12 after trial, but the
#                    order was stayed (529 U.S. 1014) and reversed by [CROMARTIE-II] -> did not stand.
# [CROMARTIE-II]     Easley v. Cromartie (2001) -> context: reversed the 2000 invalidation; upheld District 12.
# Excluded on purpose: Shaw v. Reno, 509 U.S. 630 (1993) established the racial-gerrymander doctrine
#   but concerned the 1992 plan -> deeper-predecessor context, noted below.
