# [NCGA-S249]
# SB 249: Senate 2nd reading 2025-10-20 (25-20, RCS S-495), 3rd reading 2025-10-21 (26-20, RCS S-498);
# House 2nd reading 2025-10-22 (66-48, RCS H-620), 3rd reading same day; chaptered as SL 2025-95 on 2025-10-22.
