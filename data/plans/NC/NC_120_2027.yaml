# [SABATO] 11-3 is a PROJECTION (no general election yet). [NCSBE] map in force; used in the 2026 primary.
notes: >-
  This is North Carolina's first mid-decade congressional change of the 2020s cycle and the first
  plan in this dataset sourced outside the Lewis archive. Because the Census Bureau publishes no
  block-equivalency file for a map drawn off the decennial cycle, the address-to-district lookup is
  built from the General Assembly's own block assignment file, exactly as it is for the 2019
  remedial plan that governs the 117th Congress. The redraw is projected to move the delegation from
  10-4 to 11-3 Republican, chiefly by making District 1 — the state's one competitive U.S. House
  seat in 2024 — substantially more Republican [SABATO]. Because the November 2026 general election
  has not yet occurred, that 11-3 figure is a projection rather than a result: the map is in force
  for the 2026 cycle and was used in the March 3, 2026 primary, but the delegation it produces will
  not be known until November [NCSBE]. The plan governs the 120th Congress, which is not seated
  until January 2027; the 119th Congress's members, elected in 2024, hold office until then.

