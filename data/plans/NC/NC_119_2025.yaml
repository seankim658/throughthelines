# [CLERK-2024] 2024 result: 10 R - 4 D (from 7-7); three formerly Democratic seats flipped.
# [NCGA-S249]  2025 mid-decade successor (SL 2025-95); supersession context.
notes: >-
  This plan governed the 119th Congress and produced a 10-4 Republican delegation in the 2024
  election, a shift from the even 7-7 split under the 2022 court-drawn interim plan it replaced, as
  three formerly Democratic seats flipped to Republicans [CLERK-2024]. It was the first North
  Carolina congressional map enacted after the state Supreme Court's April 2023 reversal removed
  the state-constitutional bar on partisan gerrymandering, and it was widely described as a
  Republican gerrymander [AAR]. Before the federal challenge was resolved, the General Assembly had
  already replaced this plan mid-decade with a 2025 congressional plan (Senate Bill 249, Session
  Law 2025-95, ratified October 22, 2025), which reconfigured Districts 1 and 3 to favor
  Republicans and was projected to yield an 11-3 delegation for the 2026 election [NCGA-S249].

