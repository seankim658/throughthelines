#              UPHELD this plan on the merits 2025-11-20; companion case N.C. NAACP v. Berger
#              (1:23-cv-01104) was consolidated into it. Also at FindLaw and CourtListener
#              (docket 68059930). NOTE: 2025 WL 3296273 is the Nov-26 PI denial on the 2025 map, NOT
#              this Nov-20 merits order; cite by docket/Doc. number.
# [SHELBY]     Shelby County v. Holder (2013) -> context: ended VRA Section 5's practical operation.
# Excluded on purpose: Moore v. Harper, 600 U.S. 1 (2023) concerns the 2021 plan's litigation, not this
#   plan; it belongs in the predecessor chain's files.
