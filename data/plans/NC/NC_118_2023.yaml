# [HARPER-ORDER]
# Court-imposed plan; date is the panel's adoption order (Harper v. Hall, No. 21 CVS 015426),
# entered 2022-02-23. Not a legislative enactment -> no bill, no gubernatorial-veto question.
enacted_date: 2022-02-23
# [HARPER-ORDER, SHELBY]
# Took effect on adoption; no Section 5 preclearance (Shelby County v. Holder, 2013).
effective_date: 2022-02-23

# [HARPER-ORDER, AAR, NCGA-MAP]
origin: court
# [HARPER-ORDER] adopted by the Wake Cty. three-judge panel 2022-02-23; drawn by three special masters
#                (former justices Orr and Edmunds, former UNC System president Ross) with expert advisors.
# [HARPER-I]     enabling strike: NC Supreme Court struck the enacted 2021 plan (SB 740 / SL 2021-174) 2022-02-04.
# [NCGA-MAP]     designation "Interim Congressional" (C2022C); 2020-census tabulation blocks.
# [SHELBY]       no preclearance (post-Shelby County). Court plan -> veto exemption is inapplicable.
origin_details: >-
  A court-imposed interim plan adopted by the Wake County Superior Court three-judge panel on
  February 23, 2022 and used only for the 2022 U.S. House election [HARPER-ORDER]. The panel acted
  after the North Carolina Supreme Court struck the General Assembly's enacted 2021 plan (Senate
  Bill 740 / Session Law 2021-174) as an unconstitutional partisan gerrymander in Harper v. Hall on
  February 4, 2022 [HARPER-I]. When the legislature's remedial 2022 congressional plan was found
  still noncompliant, the panel rejected it and instead adopted a congressional map drawn by three
  court-appointed special masters (former North Carolina Supreme Court justices Robert Orr and
  Robert Edmunds and former UNC System president Thomas Ross) with expert advisors [HARPER-ORDER].
  The adopted map is designated the "Interim Congressional" plan and is built on 2020-census
  tabulation blocks [NCGA-MAP]. Because Shelby County v. Holder had ended the practical operation of
  Voting Rights Act Section 5 preclearance in 2013, the plan required no federal preclearance
  [SHELBY].

# Interim by design — the court limited it to the 2022 election — then replaced through the ordinary
# cycle. Not struck down -> struck_down: false; struck_down_districts: [].
# [HARPER-III] The 2023-04-28 reversal followed the 2022 election and left this used map undisturbed.
struck_down: false
struck_down_details: >-
  This plan was not struck down. It was a court-imposed interim map, limited by the court to the
  2022 election, and was replaced for 2024 by a plan the General Assembly enacted after the
  litigation concluded [AAR]. The North Carolina Supreme Court's April 2023 reversal of Harper v.
  Hall, and the U.S. Supreme Court's decision in Moore v. Harper, both followed the 2022 election
  and left this already-used interim map undisturbed [HARPER-III].
struck_down_districts: []

# predecessor NC_117_2021 = 2019 plan (HB 1029 / SL 2019-249), used in the 2020 election. The enacted 2021
#   plan (SB 740 / SL 2021-174, struck in Harper v. Hall) and the rejected 2022 remedial plan (SB 745 /
#   SL 2022-3) were never used in an election, so the election-sequence predecessor is the 2019 plan.
# superseded_by NC_119_2025 = 2023 plan (SB 757 / SL 2023-145, enacted 2023-10-25), used in the 2024 election.
superseded_by: NC_119_2025
predecessor: NC_117_2021

# Roles are relative to THIS (2022 interim) plan:
# [HARPER-I]     Harper v. Hall (N.C. 2022-02-04) -> enabling: struck the enacted 2021 plan
#                (SB 740 / SL 2021-174), triggering this remedy (4-3; NC Const. Free Elections /
#                Equal Protection / Free Speech / Assembly clauses).
# [HARPER-ORDER] Harper v. Hall remedial order (Wake Cty. three-judge panel, 2022-02-23) -> remedial:
#                the order that imposed THIS interim plan; unpublished, No. 21 CVS 015426. The NC Courts
#                PDF is a scan; a text version is the Moore v. Harper cert appendix, App. F (269a-306a).
# [HARPER-III]   Harper v. Hall on rehearing (N.C. 2023-04-28) -> context: reversed Harper-I and held
#                partisan-gerrymandering claims nonjusticiable; came after the 2022 election and did not
#                disturb this already-used map.
# [MOORE]        Moore v. Harper (U.S. 2023-06-27) -> context: rejected the independent-state-legislature
#                theory (6-3); did not invalidate or uphold this map.
# [SHELBY]       Shelby County v. Holder (2013) -> context: ended VRA Section 5's practical operation.
