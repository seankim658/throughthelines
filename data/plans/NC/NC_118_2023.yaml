# [CLERK-2022] 2022 result: 7 R - 7 D across 14 seats (NC gained a 14th seat after the 2020 census).
# [HARPER-III, MOORE] the litigation continued past the 2022 election; neither disturbed this map.
notes: >-
  This is the only court-drawn congressional map in North Carolina's history within this dataset's
  window, and it produced an even seven-to-seven split among the state's fourteen seats in the 2022
  election — the first cycle after North Carolina gained a fourteenth seat in the 2020
  reapportionment [CLERK-2022]. The litigation that produced it continued after that election: a
  recomposed North Carolina Supreme Court reversed Harper v. Hall on April 28, 2023 and held
  partisan-gerrymandering claims nonjusticiable under the state constitution [HARPER-III], and the
  U.S. Supreme Court in Moore v. Harper rejected the independent-state-legislature theory [MOORE].
  Neither disturbed this interim map; together they shaped the 2023 plan that replaced it.

