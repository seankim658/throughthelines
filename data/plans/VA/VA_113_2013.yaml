# [PAGE-II] District 3 BVAP increased from 53.1% under the predecessor to 56.3% under this plan;
#           the opinion also describes the mapdrawers' 55% BVAP threshold.
# [WITTMAN] The strike stood without a merits ruling.
# [CLERK]   The 2012 and 2014 House election statistics each show Virginia electing eight Republicans 
#           and three Democrats.
notes: >-
  This plan raised the Third District's Black voting-age population from 53.1 percent under the
  predecessor to 56.3 percent [PAGE-II]. The court held that race predominated in drawing the
  district and that its design was not narrowly tailored to a compelling governmental interest
  [PAGE-II]. The plan governed the 2012 and 2014 elections before being replaced by the
  court-imposed remedial plan for the 2016 election [AAR]. Virginia's eleven-member U.S. House
  delegation was eight Republicans and three Democrats in both the 113th and 114th Congresses
  [CLERK]. The Supreme Court dismissed the intervenors' appeal for lack of Article III standing 
  and did not review the district court's racial-gerrymandering judgment on the merits [WITTMAN].

