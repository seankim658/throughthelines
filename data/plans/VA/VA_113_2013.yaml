    citation: "No. 3:13-cv-00678, 2015 WL 3604029 (E.D. Va. June 5, 2015) (three-judge court)"
    role: invalidating
    url: https://law.justia.com/cases/federal/district-courts/virginia/vaedce/3:2013cv00678/299639/137/
    archived_url: https://web.archive.org/web/20260713211115/https://law.justia.com/cases/federal/district-courts/virginia/vaedce/3:2013cv00678/299639/137/
    source_code: PAGE-II
  - case: Cantor v. Personhuballah
    citation: "135 S. Ct. 1699 (2015) (mem.)"
    role: context
