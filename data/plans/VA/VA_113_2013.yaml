# [LIS-302.2, AAR]
# HB 251 (2012 Regular Session), enacted as Chapter 1 of the 2012 Acts of Assembly
# (Acts 2012, c. 1); codified at Va. Code s. 24.2-302.2. The predecessor s. 24.2-302.1 repeal
# note reads "Repealed by Acts 2012, c. 1, cl. 2, effective January 25, 2012." Signed by
# Gov. Bob McDonnell (R) on 2012-01-25 (the enacted date); passed the General Assembly
# 2012-01-20.
enacted_date: 2012-01-25
# [AAR, PAGE]
# Section 5 covered jurisdiction; effective_date is the DOJ preclearance date. AAR gives
# 2012-03-14, and the Page opinion recites that DOJ precleared the plan on that date. (Shelby
# County v. Holder, 2013-06-25, later ended Section 5 coverage but does not change this
# plan's preclearance.)
effective_date: 2012-03-14

# [SABATO, LII]
origin: legislature
# [SABATO] Enacted under unified Republican control (Gov. McDonnell; Republican House of
#          Delegates; a 20-20 state Senate with Republican Lt. Gov. Bolling breaking ties). An
#          incumbent-protection map that preserved the 8-3 Republican delegation split.
# [LII]    Raised District 3's Black voting-age population from 53.1% to 56.3% using a 55% BVAP
#          target, packing Black (Democratic-leaning) voters to make surrounding districts safer.
origin_details: >-
  A 2011 attempt deadlocked between the Republican-controlled House and the then 
  Democratic-controlled Senate; after the November 2011 elections shifted the Senate to a 
  20-20 tie under Republican Lt. Gov. Bill Bolling, the General Assembly passed essentially 
  the same map (authored by Del. Bill Janis and enacted as HB 251, patroned by Del. Robert 
  B. "Rob" Bell) in January 2012, and Gov. Bob McDonnell (R) signed it on January 25, 2012. 
  It was an incumbent-protection map: the General Assembly used a 55% Black-voting-age-population 
  target and raised the Third District's BVAP from 53.1% to 56.3%, concentrating Black, 
  Democratic-leaning voters and thereby making the adjacent Republican-held districts safer. 
  Under this map Republicans held 8 of Virginia's 11 seats.

# Struck down as an unconstitutional racial gerrymander of District 3 by a three-judge E.D. Va.
# court, left in place after the Supreme Court's 2016 standing dismissal. [PAGE, WITTMAN]
struck_down: true
struck_down_details: >-
  Struck down. A three-judge U.S. District Court for the Eastern District of Virginia first held
  the Third District an unconstitutional racial gerrymander in Page v. Virginia State Board of
  Elections, 58 F. Supp. 3d 533 (E.D. Va. 2014) (Page I): race predominated in raising the
  district's Black voting-age population to 56.3%, and the plan was not narrowly tailored. The
  Supreme Court vacated and remanded for reconsideration in light of Alabama Legislative Black
  Caucus v. Alabama (Cantor v. Personhuballah, 575 U.S. ___ (2015)); on remand the panel again
  held District 3 unconstitutional (Page II, cited below) and set a September 1, 2015 deadline
  to redraw. The plan still governed the 2012 and 2014 elections; when the General Assembly did
  not act, the court adopted a special-master remedial map for 2016 (the successor,
  VA_115_2017). The invalidation became final after the Supreme Court dismissed the intervenors'
  appeal for lack of standing (Wittman v. Personhuballah, below) without reaching the merits.
struck_down_districts: [3]

# predecessor VA_108_2003 = Virginia's 2001 plan (HB 18, Acts 2001 Sp. Sess. I c. 7,
#   s. 24.2-302.1), governing the 108th-112th Congresses. Setting this predecessor closes the
#   reciprocity with VA_108_2003.superseded_by.
# superseded_by VA_115_2017 = the 2016 court-drawn remedial plan (special master Bernard
#   Grofman; adopted by the E.D. Va. three-judge court 2016-01-07 in Personhuballah v. Alcorn,
#   155 F. Supp. 3d 552), governing the 115th onward. [AAR]
superseded_by: VA_115_2017
predecessor: VA_108_2003

# [PAGE]    Page v. Va. State Bd. of Elections (Page II, on remand) -> invalidating: the
#           operative, reaffirmed decision striking District 3 as a racial gerrymander. The
#           earlier Page I (58 F. Supp. 3d 533 (E.D. Va. 2014)) was VACATED by the Supreme
#           Court's GVR (Cantor v. Personhuballah, 575 U.S. ___ (2015)), so Page II is the
#           decision that stands; both are recounted in struck_down_details.
# [WITTMAN] Wittman v. Personhuballah -> context: the Supreme Court dismissed the intervenors'
#           appeal for lack of Article III standing. This is a STANDING dismissal, NOT a merits
#           affirmance; its effect was to leave Page II (and the strike) in place.
# Excluded on purpose: Personhuballah v. Alcorn, 155 F. Supp. 3d 552 (E.D. Va. 2016), is the
#           court's REMEDIAL order adopting the special master's map; it draws the SUCCESSOR and
#           belongs in VA_115_2017, not here.
court_citations:
  - case: Page v. Virginia State Board of Elections
    citation: "No. 3:13-cv-00678, 2015 WL 3604029 (E.D. Va. June 5, 2015) (three-judge court)"
    role: invalidating
    url: https://law.justia.com/cases/federal/district-courts/virginia/vaedce/3:2013cv00678/299639/137/
  - case: Wittman v. Personhuballah
    citation: "578 U.S. 539, 136 S. Ct. 1732 (2016)"
    role: context
    url: https://supreme.justia.com/cases/federal/us/578/14-1504/

# Third District Black VAP across the cycle: 53.1% (2001 plan) -> 56.3% under this plan (the act
#   that triggered the racial-gerrymander finding) [LII] -> 45.3% under the 2016 remedial plan.
notes: >-
  This plan increased the Third District's Black voting-age population to 56.3% (from 53.1% under
  the predecessor), which the court found was the product of a racial gerrymander; the 2016
  remedial plan later reduced it to 45.3%. The plan governed the 2012 and 2014 elections before
  being replaced for 2016.

