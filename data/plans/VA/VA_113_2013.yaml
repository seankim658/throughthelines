# [LIS-H251, LIS-302-2]
# HB 251 (2012 Regular Session; chief patron Del. Robert B. Bell) passed the House 74-Y 21-N
# (2012-01-13) and the Senate 20-Y 19-N (2012-01-20). Gov. Bob McDonnell approved it on
# 2012-01-25 as Chapter 1 of the 2012 Acts of Assembly. The chapter enacted Va. Code
# s. 24.2-302.2 and provided that the act was in force from its passage.
enacted_date: 2012-01-25
# [PAGE-II, AAR]
# Virginia was then subject to Section 5 preclearance. DOJ precleared the congressional plan on
# 2012-03-14; the Page three-judge court records that date, and AAR independently reports it.
effective_date: 2012-03-14

# [LIS-H251, SABATO]
origin: legislature
# [LIS-H251, ACTS-1] HB 251, chiefly patroned by Del. Robert B. Bell, became Chapter 1 of the
#                    2012 Acts of Assembly. Bell was the patron of the enacted bill; Bill Janis
#                    had sponsored the substantially similar 2011 proposal discussed in later
#                    accounts of the map's development.
# [SABATO]           The 2011 effort stalled under divided legislative control; after the 2011
#                    election produced a 20-20 Senate, Lt. Gov. Bill Bolling could break ties.
# [PAGE-II]          The enacted plan increased District 3 BVAP from 53.1% to 56.3%; the court
#                    found that mapdrawers used a 55% BVAP threshold for District 3.
origin_details: >-
  The Virginia General Assembly enacted the plan through House Bill 251, chiefly patroned by
  Delegate Robert B. Bell, which Governor Bob McDonnell approved as Chapter 1 of the 2012 Acts of
  Assembly on January 25, 2012 [LIS-H251] [ACTS-1]. The enacted bill followed a substantially
  similar 2011 proposal associated with Delegate Bill Janis that had stalled while the House of
  Delegates and Senate were controlled by different parties; after the 2011 election left the
  Senate divided 20-20, Republican Lieutenant Governor Bill Bolling could cast tie-breaking votes
  [SABATO]. During preparation of the plan, mapdrawers used a 55 percent Black-voting-age-population
  threshold for the Third District, whose Black voting-age population increased from 53.1 percent
  to 56.3 percent [PAGE-II]. The resulting map protected the existing delegation configuration, under
  which Republicans held eight of Virginia's eleven congressional seats [SABATO].

# A three-judge E.D. Va. court held District 3 to be an unconstitutional racial gerrymander.
# The Supreme Court later dismissed the intervenors' appeal for lack of standing without reaching
# the merits, leaving the district court's judgment undisturbed. [PAGE-II, WITTMAN]
struck_down: true
# [PAGE-II] the operative invalidating decision (on remand, 2015-06-05).
# [CANTOR]  the SCOTUS GVR (2015-03-30) that vacated the first decision (Page I).
# [WITTMAN] the standing dismissal (2016-05-23); the Court did not reach the merits, and the
#           district court's judgment remained in effect.
# [AAR]     the remedial sequence: missed 2015-09-01 deadline -> special-master map for 2016.
struck_down_details: >-
  Struck down. In October 2014, a three-judge U.S. District Court for the Eastern District of
  Virginia held the Third District to be an unconstitutional racial gerrymander. The Supreme Court
  subsequently vacated that judgment and remanded the case for reconsideration in light of Alabama
  Legislative Black Caucus v. Alabama [CANTOR]. On remand, the same panel again held that race
  predominated in drawing the Third District and that the district was not narrowly tailored to a
  compelling governmental interest; that June 5, 2015 judgment is the operative merits decision
  supporting this record's strikedown designation [PAGE-II]. The panel ordered the General Assembly
  to adopt a remedial plan by September 1, 2015 [PAGE-II]. The plan nonetheless governed the 2012 and
  2014 elections; when the General Assembly did not meet the deadline, the court adopted a
  special-master-drawn remedial map for the 2016 election — the successor plan [AAR]. The Supreme 
  Court later dismissed the intervenor members of Congress's appeal for lack of Article III 
  standing without reaching the merits, leaving the district court's judgment in effect [WITTMAN].
struck_down_districts: [3]

# predecessor VA_108_2003 = Virginia's 2001 legislative plan, which governed the
#   108th-112th Congresses. This reference is reciprocal with
#   VA_108_2003.superseded_by.
# superseded_by VA_115_2017 = the court-imposed remedial plan adopted on 2016-01-07
#   in Personhuballah v. Alcorn. It governed the 115th-117th Congresses before being
#   replaced by Virginia's post-2020-Census plan. [AAR]
superseded_by: VA_115_2017
predecessor: VA_108_2003

# Roles are relative to this plan:
# [PAGE-II] Page v. Virginia State Board of Elections (on remand) -> invalidating: the June 5,
#           2015 merits decision holding District 3 to be an unconstitutional racial gerrymander.
#           The Supreme Court had vacated the panel's earlier 2014 judgment before this ruling.
# [CANTOR]  Cantor v. Personhuballah -> context: the Supreme Court's summary disposition vacating
#           the 2014 judgment and remanding in light of Alabama Legislative Black Caucus v.
#           Alabama. Not a merits ruling for or against the plan.
# [WITTMAN] Wittman v. Personhuballah -> context: the Supreme Court dismissed the intervenors'
#           appeal for lack of Article III standing without reaching the merits; the district
#           court's June 5, 2015 judgment remained in effect.
court_citations:
