    archived_url: https://web.archive.org/web/20260709033640/https://www.supremecourt.gov/orders/courtorders/033015zor_5iek.pdf
    source_code: CANTOR
  - case: Wittman v. Personhuballah
    citation: "578 U.S. 539, 136 S. Ct. 1732 (2016)"
