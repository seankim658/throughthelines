# [ALCORN] District 3 BVAP 56.3% (2012 plan) -> 45.3% under this plan; District 4 BVAP 31.3% ->
#          40.9%. Districts modified: 1, 2, 3, 4, and 7 (the 3rd and the four abutting it).
# [CLERK]  Delegation: 115th 7 R - 4 D; 116th 7 D - 4 R; 117th 7 D - 4 R.
notes: >-
  The remedial plan reduced the Third District's Black voting-age population from 56.3 percent under
  the struck 2012 map to 45.3 percent, and raised the Fourth District's from 31.3 percent to 40.9
  percent; it changed only the Third District and the four districts abutting it — the First,
  Second, Fourth, and Seventh — leaving the other six as drawn in 2012 [ALCORN]. The reshaped Fourth
  District elected Democrat A. Donald McEachin in November 2016. Virginia's eleven-member U.S. House
  delegation was seven Republicans and four Democrats in the 115th Congress, then seven Democrats and
  four Republicans in both the 116th and 117th after the 2018 election flipped the Second, Seventh,
  and Tenth Districts [CLERK].

