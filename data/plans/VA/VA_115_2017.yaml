# [ALCORN]
# Special-master remedial plan adopted by a three-judge federal court; date is the court's adoption
# order in Personhuballah v. Alcorn, No. 3:13-cv-678, ECF No. 299, entered 2016-01-07. Not a
# legislative enactment -> no bill, no chapter, no gubernatorial-veto question.
enacted_date: 2016-01-07
# [ALCORN] [SHELBY]
# Took effect on adoption: the order directed the defendants to implement the plan for the 2016
# U.S. House election cycle. No operative Section 5 preclearance requirement remained after Shelby
# County v. Holder invalidated the Section 4(b) coverage formula.
effective_date: 2016-01-07

# [ALCORN] [PAGE-II]
origin: remedial
# [PAGE-II] enabling strike: the three-judge E.D. Va. court held the 2012 plan's District 3 an
#           unconstitutional racial gerrymander and ordered a remedial plan by 2015-09-01.
# [ALCORN]  adopted by the three-judge panel 2016-01-07 (Diaz, Circuit Judge, writing; O'Grady,
#           District Judge; Payne, Senior District Judge, concurring in part and dissenting in
#           part). Drawn by special master Bernard Grofman (UC Irvine), appointed 2015-09-25,
#           report filed 2015-11-16; the court adopted one of his two proposals, "Congressional
#           Plan Modification 16" ("Plan 16").
# [SHELBY]  no operative Section 5 preclearance requirement after Shelby County invalidated the
#           Section 4(b) coverage formula.
origin_details: >-
  Drawn by court-appointed special master Bernard Grofman and adopted by a three-judge federal
  district court, not the legislature. After the U.S. District Court for the Eastern District 
  of Virginia held the 2012 plan's Third District to be an unconstitutional racial gerrymander 
  and ordered the General Assembly to adopt a remedial plan by September 1, 2015, the General 
  Assembly convened but failed to act [PAGE-II]. The three-judge panel then appointed Dr. Bernard 
  Grofman of the University of California, Irvine as special master; he filed a report proposing 
  two remedial plans, and on January 7, 2016 the court adopted one of them, "Congressional
  Plan Modification 16," and directed the defendants to implement it for the 2016 election cycle
  [ALCORN]. The special master was directed to work from population equality and traditional,
  race-neutral districting principles (compactness, land contiguity, and respect for county and
  city boundaries) rather than racial targets, and the plan altered only the Third District and the
  four districts abutting it, leaving the other six untouched [ALCORN]. 

# Not struck down. This is the remedial plan; it governed three election cycles and was replaced
# through the ordinary post-2020-Census cycle. [ALCORN] [WITTMAN] [AAR]
struck_down: false
# [WITTMAN] the intervenors' appeal from the remedy was dismissed for lack of Article III standing
#           (2016-05-23), leaving the special master's plan in force. The Supreme Court had earlier
#           declined to stay implementation (136 S. Ct. 998 (2016)), so the plan governed 2016.
struck_down_details: >-
  This plan was not struck down. It was itself the remedy for the racial gerrymander found in the
  predecessor plan [PAGE-II]. Members of Congress who had intervened to defend the old map appealed
  the remedial order, but the U.S. Supreme Court dismissed their appeal for lack of Article III
  standing without reaching the merits, leaving the special master's plan in force [WITTMAN]. No
  district of this plan was invalidated; it governed the 2016, 2018, and 2020 elections and was 
  replaced through the ordinary post-2020-Census cycle [AAR].
struck_down_districts: []

# predecessor VA_113_2013 = Virginia's 2012 plan (HB 251, Acts 2012 c. 1, s. 24.2-302.2), whose
#   Third District was invalidated as an unconstitutional racial gerrymander; setting this closes
#   reciprocity with VA_113_2013.superseded_by.
# superseded_by VA_118_2023 = Virginia's post-2020-Census plan, adopted by the Supreme Court of
#   Virginia 2021-12-28 after the Virginia Redistricting Commission deadlocked (special masters
#   Bernard Grofman and Sean Trende), first used in the 2022 election. [AAR]
superseded_by: VA_118_2023
predecessor: VA_113_2013

# Roles are relative to THIS plan:
# [PAGE-II] Page v. Va. State Bd. of Elections (on remand) -> enabling: the invalidation of the
#           2012 plan's Third District and the order requiring adoption of a remedial plan.
# [ALCORN]  Personhuballah v. Alcorn -> remedial: the order adopting special master Bernard
#           Grofman's Plan 16. This is the plan's originating instrument; there is no enacting
#           legislation.
# [WITTMAN] Wittman v. Personhuballah -> context: the Supreme Court dismissed the intervenors'
#           appeal for lack of standing, leaving this plan in force. A STANDING dismissal, not a
#           merits affirmance.
# [SHELBY]  Shelby County v. Holder -> context: invalidated the Section 4(b) coverage formula,
#           leaving Virginia without an operative Section 5 preclearance obligation.
# Caption note: the same litigation ran as Page v. Virginia State Board of Elections (district
#   court) -> Cantor v. Personhuballah (first appeal) -> Personhuballah v. Alcorn (remedial phase)
#   -> Wittman v. Personhuballah (second appeal), as lead intervenors and officials changed.
