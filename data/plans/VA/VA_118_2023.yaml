# [VASC]  Virginia kept 11 seats after the 2020 census. Third District Black VAP 42.14%; Fourth
#         District 45.37% (special masters' Final Memorandum, incorporated by the order). Neither is
#         majority-Black; both are minority ability-to-elect districts.
# [CLERK] Delegation: 6 D - 5 R in both the 118th and the 119th Congresses.
notes: >-
  Virginia retained eleven congressional seats after the 2020 census, and the special masters drew
  the map essentially from scratch on race-neutral criteria rather than modifying the predecessor;
  the Third District's Black voting-age population is 42.14 percent and the Fourth District's is
  45.37 percent, and the special masters treated both as districts in which Black voters can elect
  their candidate of choice without setting a fixed majority-Black threshold [VASC]. Virginia's
  eleven-member U.S. House delegation was six Democrats and five Republicans in both the 118th and
  the 119th Congresses [CLERK]. Two seats changed hands mid-term without changing that balance,
  following the deaths of Representatives Donald McEachin in 2022 and Gerry Connolly in 2025 and the
  special elections that followed [CLERK].

