# [VASC]
# Court-imposed plan; date is the Supreme Court of Virginia's final order adopting the maps,
# entered 2021-12-28. Not a legislative enactment -> no bill, no chapter, no veto question.
enacted_date: 2021-12-28
# [VASC] [SHELBY]
# The order adopts the maps "effective immediately" and directs the Department of Elections to
# implement them for the 2022 congressional elections. No Section 5 preclearance: Shelby County v.
# Holder (2013) ended Virginia's coverage, and a court-drawn plan would not require it regardless.
effective_date: 2021-12-28

# [VASC] [AAR]
origin: court
# [AAR]        the Virginia Redistricting Commission, created by the constitutional amendment
#              approved by voters in November 2020, deadlocked and produced no congressional map in
#              October 2021, transferring the task to the Supreme Court of Virginia.
# [VASC]       final order 2021-12-28, issued by Chief Justice Donald W. Lemons on behalf of a
#              unanimous court; caption recites Va. Const. art. II, ss. 6 to 6-A and Va. Code
#              s. 30-399. Congressional and both legislative maps adopted in the SAME order.
# [LIS-30-399] the statute governing the Court's process and the criteria it must apply.
# [SHELBY]     no preclearance (post-Shelby County).
origin_details: >-
  Drawn by a court, not the legislature. Virginia's post-2020 redistricting was the first under the
  Virginia Redistricting Commission, created by a constitutional amendment that voters approved in
  November 2020; the Commission deadlocked and failed to produce a congressional map, which under
  the Constitution of Virginia transferred the task to the Supreme Court of Virginia [AAR]. The
  Court appointed two special masters (Dr. Bernard Grofman, nominated by the Democratic caucuses,
  and Sean P. Trende, nominated by the Republican caucuses) who drew a single joint map rather
  than competing proposals, working from population equality, the Voting Rights Act, compactness,
  contiguity, and communities of interest, and expressly disregarding partisanship and incumbency
  [VASC]. The statute governing the process required the Court to apply the standards set out in
  the Code of Virginia [LIS-30-399]. On December 28, 2021, Chief Justice Donald W. Lemons, on
  behalf of a unanimous Court, adopted the special masters' congressional map effective immediately
  and directed that it be implemented for the 2022 elections [VASC]. Because Shelby County v. Holder
  had ended Virginia's Section 5 coverage, the plan required no Department of Justice preclearance
  [SHELBY].

# Not struck down. No district of this plan has been invalidated; it has governed every U.S. House
# election since 2022 and remains the operative map. [VASC] [SCOTT]
struck_down: false
# [SCOTT] A 2025-2026 Democratic mid-decade effort would have replaced this map: a proposed
#         constitutional amendment passed the General Assembly twice, and the General Assembly
#         enacted and published a contingent replacement map in February 2026. A narrow majority
#         voted “yes” in the referendum that concluded on 2026-04-21. The Supreme Court of Virginia 
#         voided the amendment 4-3 on 2026-05-08 (Scott v. McDougle, Record No. 260127), holding there 
#         had been no valid intervening general election between the two legislative votes. On 
#         2026-05-15, the U.S. Supreme Court denied an emergency request to halt the Virginia Supreme 
#         Court ruling [SCOTUS-2026]. The HB 29 map therefore NEVER took effect and is not a successor 
#         plan. This is a political and state-constitutional matter, NOT a judicial invalidation of this plan.
struck_down_details: >-
  This plan has not been struck down. It survived an attempt to replace it when Democrats pursued a 
  mid-decade redistricting through a state constitutional amendment, paired with a contingent replacement 
  map enacted in February 2026. A narrow majority voted “yes” in the April 2026 referendum, but the 
  Supreme Court of Virginia held that the referendum had no legal efficacy because the amendment process 
  violated the Virginia Constitution, holding that the two required legislative votes were not separated 
  by a valid intervening general election. The U.S. Supreme Court later denied an emergency request to 
  halt that ruling [SCOTUS-2026]; the replacement map never took effect, and the Court confirmed that this 
  plan remains the governing map for the 2026 congressional elections [SCOTT].
struck_down_districts: []

