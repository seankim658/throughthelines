# Source tags (each is a source_code on a reference below; cite inline in prose as [CODE]):
#   [AAR]        All About Redistricting, VA        https://redistricting.lls.edu/state/virginia/
#   [LIS-SB13]   Virginia LIS, SB 13 (1998)         https://legacylis.virginia.gov/cgi-bin/legp604.exe?981+sum+SB13
#   [ACTS-1]     1998 Acts of Assembly, Chapter 1   https://legacylis.virginia.gov/cgi-bin/legp604.exe?981+ful+CHAP0001
#   [SABATO]     UVA Center for Politics            https://centerforpolitics.org/crystalball/virginias-redistricting-history-whats-past-is-prologue/
#   [CLERK]      Clerk of the U.S. House, stats     https://history.house.gov/Institution/Election-Statistics/
#   [MOON]                                          see court_citations below
# =============================================================================
plan_id: VA_106_1999
state: VA
chamber: congressional
congress_start: 106
congress_end: 107
source_file: district_geometry/lewis/VA/Virginia_106_to_107.geojson
source_commit: f107b1b6c149c1b759cbb9b5bb14111a2355d6a1
schema_version: 1

# [LIS-SB13, ACTS-1]
# SB 13 (patron Sen. Kevin G. Miller) passed the Senate 32-7 on 1998-01-21 and the House 69-27 
# on 1998-02-02. Governor James S. Gilmore III approved it as Chapter 1 of the 1998 Acts of 
# Assembly on 1998-02-11. The enacted chapter amended and reenacted Va. Code s. 24.2-302 and 
# took effect upon passage.
enacted_date: 1998-02-11
# [ACTS-1] [AAR] [MOON]
# Chapter 1 took effect upon passage under Virginia law on 1998-02-11, but Virginia was then a
# Section 5 covered jurisdiction. Under this dataset's convention, effective_date therefore records
# the federal preclearance date rather than the chapter's state-law effective date. No primary DOJ
# no-objection determination or authoritative secondary source giving the preclearance date has
# been located. The plan must have been precleared before it was used for the November 1998 election,
# but the exact date remains unknown. Moon's 1992-02-18 date applies to the predecessor 1991 plan,
# and 2001-10-16 applies to successor plan VA_108_2003; neither date belongs to this plan.
effective_date: unknown

# [MOON, LIS-SB13, ACTS-1]
origin: legislature
# [MOON]     The federal court invalidated District 3 of the predecessor 1991 plan and ordered that
#            no further election be held in that district until a constitutional plan was enacted.
# [LIS-SB13] The General Assembly responded through SB 13, which revised the 1st, 2nd, 3rd, 4th,
#            and 7th Districts.
# [ACTS-1]   Chapter 1 enacted those district boundaries by amending and reenacting Va. Code
#            § 24.2-302. Because the legislature enacted the replacement map, origin is
#            `legislature`; the court decision is enabling context rather than the plan's origin.
origin_details: >-
  In Moon v. Meadows, a three-judge panel of the U.S. District Court for the Eastern District of
  Virginia held that District 3 of Virginia's predecessor 1991 congressional plan was an
  unconstitutional racial gerrymander and enjoined further elections in that district until a
  constitutional replacement was enacted [MOON]. The Virginia General Assembly responded by passing
  Senate Bill 13, which revised the boundaries of the First, Second, Third, Fourth, and Seventh
  Districts [LIS-SB13]. Governor James S. Gilmore III approved the bill on February 11, 1998, and it
  became Chapter 1 of the 1998 Acts of Assembly, amending and reenacting Va. Code § 24.2-302
  [LIS-SB13] [ACTS-1]. Although the plan was enacted in response to a federal-court order, the
  legislature drew and enacted the replacement map; its origin is therefore `legislature`, while
  Moon is recorded as an enabling court decision.

# [MOON] Moon invalidated District 3 of the predecessor 1991 plan, not this replacement plan.
# [AAR]  This plan governed the 1998 and 2000 U.S. House elections and was later replaced through
#        the ordinary post-2000-Census redistricting cycle.
struck_down: false
struck_down_details: >-
  This plan was not struck down, and no district within it was invalidated. Moon v. Meadows
  invalidated District 3 of the predecessor 1991 congressional plan and prompted the enactment of
  this replacement map; it did not invalidate this plan [MOON]. The map governed Virginia's 1998
  and 2000 U.S. House elections before being superseded through the ordinary post-2000-Census
  redistricting cycle [AAR].
struck_down_districts: []

# [MOON]
# The immediate predecessor was Virginia's 1991 congressional plan. Moon invalidated District 3 of
# that plan, prompting enactment of this 1998 replacement. The 1991 plan falls outside the modeled
# coverage window and has no plan record, so predecessor remains null.
#
# [AAR]
# VA_108_2003 is Virginia's post-2000-Census congressional plan. It replaced this map through the
# ordinary decennial redistricting cycle and governed beginning with the 108th Congress.
superseded_by: VA_108_2003
predecessor: null

# [MOON] Moon v. Meadows (three-judge E.D. Va., 1997-02-07) invalidated District 3 of the predecessor
#        1991 congressional plan as an unconstitutional racial gerrymander and enjoined further
#        elections in that district until a constitutional replacement was enacted. The decision
#        prompted the General Assembly to enact SB 13, so its role for this plan is `enabling`.
# Litigation challenging Virginia's successor 2001 congressional plan, including Wilkins v. West
# and Hall v. Virginia, belongs in VA_108_2003 rather than this plan record.
court_citations:
  - case: Moon v. Meadows
    citation: "952 F. Supp. 1141 (E.D. Va. 1997)"
    role: enabling
    url: https://law.justia.com/cases/federal/district-courts/FSupp/952/1141/1432147/
    archived_url: https://web.archive.org/web/20260713204720/https://law.justia.com/cases/federal/district-courts/FSupp/952/1141/1432147/
    source_code: MOON

# [MOON]   District 3 of the predecessor 1991 plan had a Black voting-age population above
#          61 percent.
# [SABATO] The 1998 redraw reduced District 3's Black voting-age population to approximately
#          50 percent.
# [CLERK]  Virginia's delegation was 6 D - 5 R in the 106th Congress and
#          7 R - 3 D - 1 independent in the 107th Congress.
notes: >-
  District 3 of the predecessor 1991 plan, which Moon v. Meadows invalidated, had a Black voting-age
  population above 61 percent [MOON]. The legislature's 1998 redraw reduced the district's Black
  voting-age population to approximately 50 percent [SABATO]. Under this plan, Virginia's
  eleven-member U.S. House delegation was six Democrats and five Republicans in the 106th Congress,
  and seven Republicans, three Democrats, and one independent in the 107th Congress [CLERK].
  Data-vintage note: the source polygons in Lewis's Virginia_106_to_107.geojson represent this
  1990s-era plan but are joined by the pipeline to 2000 Census blocks. That cross-vintage join can
  produce a thin boundary seam affecting a small number of address lookups for the 107th Congress.

