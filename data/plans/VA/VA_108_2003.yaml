# [LIS-302.1, LIS-302]
# HB 18, enacted as Chapter 7 of the 2001 Special Session I Acts of Assembly
# (Acts 2001, Sp. Sess. I, c. 7); codified at Va. Code s. 24.2-302.1. The codified text
# ends "(2001, Sp. Sess. I, c. 7.)" and the predecessor s. 24.2-302 repeal note reads
# "Repealed by Acts 2001, Sp. Sess. I, c. 7, cl. 2, effective July 19, 2001." Passed the
# General Assembly July 10, 2001; approved by Gov. Gilmore July 19, 2001 (the enacted date).
enacted_date: 2001-07-19
# [AAR, HALL]
# Section 5 covered jurisdiction; effective_date is the DOJ preclearance date. AAR gives
# 2001-10-16 (secondary source); the Hall opinion confirms the plan was precleared under
# Section 5 but does not recite the date. No primary DOJ letter located — verify via DOJ
# Section 5 determination records if a primary source is needed.
effective_date: 2001-10-16

# [SABATO, AAR]
origin: legislature
# [SABATO] First Virginia redistricting under unified Republican control (Gov. Gilmore plus
#          both chambers); an incumbent-protection map.
origin_details: >-
  Enacted by the Virginia General Assembly as House Bill 18, which became Chapter 7 of the
  2001 Special Session I Acts of Assembly (codified at Va. Code § 24.2-302.1). The General
  Assembly passed HB 18 on July 10, 2001, and Governor Jim Gilmore (R) signed it on July 19,
  2001. It was the first Virginia congressional redistricting under a Republican trifecta
  (Gov. Gilmore and Republican majorities in both the House of Delegates and the state
  Senate) and was an incumbent-protection map for members of both parties. It left Rep. Bobby 
  Scott's (D) majority-minority Third District largely intact while shifting Black population 
  out of the Fourth District (lowering its Black voting-age population from about 37.8% to 
  32.3%), making both seats safer for their incumbents. Under this map Republicans generally 
  held 8 of Virginia's 11 seats and Democrats 3 through the 2002-2010 elections.

# Upheld, not struck. A VRA Section 2 vote-dilution challenge to the Fourth District (Hall v.
# Virginia) was dismissed and the dismissal affirmed. [HALL]
struck_down: false
struck_down_details: >-
  Not struck down. Nine Black voters challenged the plan under Section 2 of the Voting Rights
  Act in Hall v. Virginia, alleging it "packed" Black voters into the Third District and
  "cracked" the Fourth. The U.S. District Court for the Eastern District of Virginia dismissed
  the complaint, holding that Black voters could not form a numerical majority in a single
  Fourth District and so failed the first Gingles precondition (a coalition/influence-district
  theory not being cognizable under Section 2); the Fourth Circuit affirmed. No district was
  invalidated.
struck_down_districts: []

# predecessor VA_106_1999 = Virginia's 1998 remedial plan (SB 13, Chapter 1, 1998 Acts),
#   governing the 106th-107th Congresses. Setting this predecessor closes the reciprocity
#   with VA_106_1999.superseded_by.
# superseded_by VA_113_2013 = Virginia's post-2010-Census plan (HB 251, Acts 2012, c. 1,
#   s. 24.2-302.2; signed 2012-01-25, DOJ-precleared 2012-03-14), governing the 113th onward.
#   [AAR, LIS-302.1]
superseded_by: VA_113_2013
predecessor: VA_106_1999

# [HALL] Hall v. Commonwealth of Virginia -> affirming: the Fourth Circuit upheld this plan
#        against a VRA Section 2 challenge to the Fourth District. Corrects the erroneous
#        "314 F. Supp. 2d 1357 (N.D. Va. 2004)" cite sometimes attached to this plan — Virginia
#        has no Northern District; the district-court decision is 276 F. Supp. 2d 528 (E.D. Va.
#        2003), affirmed at 385 F.3d 421 (4th Cir. 2004).
# Excluded on purpose: Wilkins v. West, 264 Va. 447, 571 S.E.2d 100 (2002), adjudicated the
#        2001 STATE House and Senate plans, NOT this congressional plan (the AAR page groups
#        the cycle's litigation together). State-legislative plans are out of scope and not
#        modeled, so Wilkins is not carried here.
# Excluded on purpose: Page v. Va. State Bd. of Elections and Wittman v. Personhuballah concern
#        the SUCCESSOR 2012 plan and belong in VA_113_2013.
court_citations:
  - case: Hall v. Commonwealth of Virginia
    citation: "276 F. Supp. 2d 528 (E.D. Va. 2003), aff'd, 385 F.3d 421 (4th Cir. 2004)"
    role: affirming
    url: https://www.courtlistener.com/opinion/2968020/hall-v-commonwealth-of-va/

# Third District Black VAP under this plan: ~53.2% (per the Fourth Circuit), remaining Rep.
#   Bobby Scott's (D) majority-minority district [HALL]. The Fourth District's reduction to
#   ~32.3% BVAP was the subject of the Hall challenge [HALL].
notes: >-
  This plan kept the Third District a majority-minority seat (about 53% Black voting-age
  population) while reducing the Fourth District's Black voting-age population to about 32%;
  the Fourth District change was the basis of the unsuccessful Hall v. Virginia Section 2
  challenge.

