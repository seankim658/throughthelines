# [LIS-302-1, LIS-302, HALL]
# HB 18 became Chapter 7 of the 2001 Special Session I Acts of Assembly (Acts 2001, Sp. Sess. I,
# c. 7) and was codified at Va. Code s. 24.2-302.1. Governor James S. Gilmore III approved it on
# 2001-07-19; Chapter 7's second enactment clause made the plan effective that same day. HB 18's
# patron, chamber-passage dates, and floor votes remain unverified because the legacy LIS bill
# history has not been retrieved.
enacted_date: 2001-07-19
# [AAR, HALL]
# Section 5 covered jurisdiction; effective_date is the DOJ preclearance date. The Hall district-
# court opinion recites DOJ preclearance on 2001-10-16, and AAR gives the same date. The underlying
# DOJ no-objection letter has not been located, so the date is supported here by the court's recital
# and a corroborating secondary source.
effective_date: 2001-10-16

# [LIS-302-1, SABATO, HALL]
origin: legislature
# [LIS-302-1] HB 18 -> Chapter 7 (Acts 2001, Sp. Sess. I, c. 7); codified at Va. Code s. 24.2-302.1.
# [LIS-302]   Chapter 7 effective 2001-07-19 (predecessor s. 24.2-302 repeal clause).
# [SABATO]    first VA congressional map under a unified Republican trifecta (Gov. Gilmore + GOP
#             House and Senate); an incumbent-protection map.
# [HALL]      Governor Gilmore approved the legislation on 2001-07-19.
# [HALL]      shifted Black residents from the 4th into the 3rd and 5th Districts; after the redraw,
#             Black residents were about 54% of the 3rd's total population and 33.6% of the 4th's.
origin_details: >-
  The Virginia General Assembly adopted the plan through House Bill 18, which became Chapter 7 of
  the 2001 Special Session I Acts of Assembly and was codified at Va. Code § 24.2-302.1 [LIS-302-1].
  Governor James S. Gilmore III approved the legislation on July 19, 2001, and Chapter 7 made the
  plan effective that same day [HALL] [LIS-302]. It was the first Virginia congressional redistricting
  under a unified Republican trifecta—Governor Gilmore together with Republican majorities in both
  the House of Delegates and the state Senate—and was an incumbent-protection map for members of
  both parties [SABATO]. It shifted Black residents out of the Fourth District and into the Third
  and Fifth Districts; after the redraw, Black residents made up about 54 percent of the Third
  District's total population and 33.6 percent of the Fourth District's total population [HALL].
  Because Virginia was then a Section 5 covered jurisdiction, the plan was precleared by the U.S.
  Department of Justice before it governed the 2002 through 2010 U.S. House elections [AAR].

# Upheld, not struck. A VRA Section 2 vote-dilution challenge to the Fourth District (Hall v.
# Virginia) was dismissed and the dismissal affirmed. [HALL]
struck_down: false
# [HALL] Section 2 challenge dismissed with prejudice (E.D. Va., 2003-08-07) and affirmed (4th Cir.,
#        2004-09-22); no district invalidated. Plaintiffs failed the first Gingles precondition
#        because they could not show a reasonably configured Black-majority Fourth District.
struck_down_details: >-
  This plan was not struck down. Nine Black voters challenged it under Section 2 of the Voting Rights
  Act in Hall v. Virginia, alleging it "packed" Black voters into the Third District and "cracked"
  the Fourth. The U.S. District Court for the Eastern District of Virginia dismissed the complaint,
  holding that the plaintiffs could not show that Black voters were sufficiently numerous and
  geographically compact to form a majority in a reasonably configured Fourth District and
  therefore failed the first Gingles precondition. The Fourth Circuit affirmed on September 22,
  2004, rejecting the plaintiffs' proposed coalition- and influence-district theories in this case
  [HALL]. No district was invalidated, and the plan governed the 2002 through 2010 elections before
  being replaced through the normal post-2010-Census cycle [AAR].
struck_down_districts: []

# predecessor VA_106_1999 = Virginia's 1998 remedial plan (SB 13, Chapter 1, 1998 Acts), governing
#   the 106th-107th Congresses. Setting this closes reciprocity with VA_106_1999.superseded_by.
# superseded_by VA_113_2013 = Virginia's post-2010-Census plan (HB 251, Acts 2012, c. 1,
#   s. 24.2-302.2; signed 2012-01-25, DOJ-precleared 2012-03-14), governing the 113th onward. [AAR]
superseded_by: VA_113_2013
predecessor: VA_106_1999

# [HALL] Hall v. Commonwealth of Virginia is the controlling litigation for this plan. The district
#        court dismissed the Section 2 challenge to the Fourth District, and the Fourth Circuit
#        affirmed. District court: 276 F. Supp. 2d 528 (E.D. Va. 2003); court of appeals:
#        385 F.3d 421 (4th Cir. 2004). The URL below opens the district-court opinion; the appellate
#        disposition is identified by its reporter citation. No certiorari petition was located.
# Excluded on purpose: Wilkins v. West concerned Virginia's 2001 state-legislative plans, not this
#        congressional plan. Page v. Virginia State Board of Elections and Wittman v. Personhuballah
#        concern the successor 2012 congressional plan and belong in VA_113_2013.
court_citations:
  - case: Hall v. Commonwealth of Virginia
    citation: "276 F. Supp. 2d 528 (E.D. Va. 2003), aff'd, 385 F.3d 421 (4th Cir. 2004)"
    role: affirming
    url: https://law.justia.com/cases/federal/district-courts/FSupp2/276/528/2464706/
    archived_url: https://web.archive.org/web/20170910081625/http://law.justia.com/cases/federal/district-courts/FSupp2/276/528/2464706/
    source_code: HALL

# [HALL]  The redraw shifted Black residents from the 4th into the 3rd and 5th Districts; afterward,
#         Black residents were about 54% of the 3rd's total population and 33.6% of the 4th's.
# [CLERK] Delegation: 8 R - 3 D in the 108th-110th; 6 D - 5 R in the 111th (2008 Democratic gains in
#         the 2nd, 5th, and open 11th); 8 R - 3 D in the 112th (2010 Republican gains in the 2nd, 5th,
#         and 9th).
notes: >-
  The redraw shifted Black residents out of the Fourth District and into the Third and Fifth
  Districts. Afterward, Black residents made up about 54 percent of the Third District's total
  population and 33.6 percent of the Fourth District's total population; the Fourth District change
  was the basis of the unsuccessful Hall v. Virginia Section 2 challenge [HALL]. Virginia's
  eleven-member U.S. House delegation was eight Republicans and three Democrats through the 108th,
  109th, and 110th Congresses, flipped to six Democrats and five Republicans in the 111th Congress
  after the 2008 election, and returned to eight Republicans and three Democrats in the 112th
  Congress after the 2010 election [CLERK].

